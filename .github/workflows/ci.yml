name: Flutter CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: |
          dart format lib test
          echo "::warning file=lib/app.dart::FORMATTING_PATCH_BASE64=$(git diff -- lib test | base64 -w0)"
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
