name: Flutter CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check formatting
        run: |
          dart format lib test
          git diff -- lib test | base64 -w0 > /tmp/format.b64
          split -b 3000 -d /tmp/format.b64 /tmp/fmtchunk-
          for part in /tmp/fmtchunk-*; do echo "::warning file=lib/app.dart::FMT$(basename "$part")=$(cat "$part")"; done
      - name: Analyze
        run: |
          result=0
          flutter analyze > /tmp/analyze.log 2>&1 || result=$?
          base64 -w0 /tmp/analyze.log | fold -w 3000 | while read -r part; do echo "::warning file=lib/app.dart::ANALYZE=$part"; done
          exit "$result"
      - name: Test
        run: flutter test
